
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# ------------------------------------------------------------
# Azure DevOps Self-Hosted Agent
# ------------------------------------------------------------

pool:
  name: agent-pool-epicbook


# ------------------------------------------------------------
# Variable Group
#
# Contains:
# AWS_ACCESS_KEY_ID       Secret
# AWS_SECRET_ACCESS_KEY   Secret
# DB_USERNAME             Secret
# DB_PASSWORD             Secret
# AWS_REGION              e.g. us-east-1
# ------------------------------------------------------------

variables:
  - group: epicbook-aws

  - name: TF_IN_AUTOMATION
    value: 'true'


stages:

# ============================================================
# STAGE 1
# Terraform Validation
# ============================================================

- stage: Terraform_Validate

  displayName: 'Terraform Validation'

  jobs:

  - job: Validate

    displayName: 'Terraform Format, Init and Validate'

    steps:

    # --------------------------------------------------------
    # Checkout
    # --------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Terraform Repository'


    # --------------------------------------------------------
    # Terraform Version
    # --------------------------------------------------------

    - script: |
        terraform version

      displayName: 'Terraform Version'


    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - script: |
        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'


    # --------------------------------------------------------
    # Terraform Init
    #
    # Connects Terraform to the S3 backend.
    # --------------------------------------------------------

    - script: |
        terraform init

      displayName: 'Terraform Init'

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - script: |
        terraform validate

      displayName: 'Terraform Validate'


# ============================================================
# STAGE 2
# Terraform Plan
# ============================================================

- stage: Terraform_Plan

  displayName: 'Terraform Plan'

  dependsOn:
    - Terraform_Validate

  condition: succeeded()

  jobs:

  - job: Plan

    displayName: 'Generate Terraform Plan'

    steps:

    # --------------------------------------------------------
    # Checkout
    # --------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Terraform Repository'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - script: |
        terraform init

      displayName: 'Terraform Init'

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - script: |
        terraform plan \
          -out=tfplan

      displayName: 'Terraform Plan'

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)

        TF_VAR_db_username: $(DB_USERNAME)
        TF_VAR_db_password: $(DB_PASSWORD)


    # --------------------------------------------------------
    # Publish Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: 'tfplan'
        artifact: 'terraform-plan'


# ============================================================
# STAGE 3
# Terraform Apply
# ============================================================

- stage: Terraform_Apply

  displayName: 'Terraform Apply'

  dependsOn:
    - Terraform_Plan

  condition: succeeded()

  jobs:

  - deployment: Apply

    displayName: 'Apply Terraform Infrastructure'

    environment: 'epicbook-production'

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Checkout repository
          # --------------------------------------------------

          - checkout: self

            displayName: 'Checkout Terraform Repository'


          # --------------------------------------------------
          # Download Terraform Plan
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2

            displayName: 'Download Terraform Plan'

            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'


          # --------------------------------------------------
          # Terraform Init
          #
          # Reconnects to the S3 remote backend.
          # --------------------------------------------------

          - script: |
              terraform init

            displayName: 'Terraform Init'

            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)


          # --------------------------------------------------
          # Terraform Apply
          #
          # Applies the exact plan generated in Stage 2.
          # --------------------------------------------------

          - script: |
              terraform apply \
                -auto-approve \
                "$(Pipeline.Workspace)/terraform-plan/tfplan"

            displayName: 'Terraform Apply'

            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

              TF_VAR_db_username: $(DB_USERNAME)
              TF_VAR_db_password: $(DB_PASSWORD)


          # --------------------------------------------------
          # Terraform Outputs
          # --------------------------------------------------

          - script: |
              terraform output

            displayName: 'Terraform Outputs'

            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

